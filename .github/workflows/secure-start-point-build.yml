name: Secure start-point build

# Variant of secure-docker-build.yml for cyber-dojo start-point images, which are
# NOT built from a Dockerfile via docker/build-push-action but by running
# `cyber-dojo start-point create` (invoked here through the caller repo's
# `make image`). Because there is no buildkit build, the two things buildkit gave
# secure-docker-build.yml for free are produced explicitly instead:
#   - the SBOM: generated with syft against the built image (SPDX 2.3, same as
#     buildkit's embedded syft-scanner), rather than `sbom: true`.
#   - there is no SLSA provenance predicate (`provenance: mode=max`), so the
#     provenance decision is not given a provenance.json attachment.
# Everything downstream (Kosli attest artifact / provenance / sbom, the distill,
# evaluate and decision steps) is shared with secure-docker-build.yml through the
# attest-and-evaluate composite action.

on:
  workflow_call:
    outputs:
      digest:
        description: The SHA256 image digest
        value: ${{ jobs.create-index.outputs.digest }}
      tagged_image_name:
        description: "eg 244531986313.dkr.ecr.eu-central-1.amazonaws.com/custom-start-points:52ec808"
        value: ${{ jobs.create-index.outputs.tagged_image_name }}

    inputs:
      # inputs for actions/checkout@v6
      checkout_repository:
        required: true
        type: string        # eg cyberdojo/custom-start-points
      checkout_ref:
        required: true
        type: string        # eg ${{ github.sha }}
      checkout_fetch_depth:
        required: true
        type: string        # eg 1

      # the image `make image` builds and where it is pushed
      image_name:
        required: true
        type: string        # eg 244531986313.dkr.ecr.eu-central-1.amazonaws.com/custom-start-points
      image_tag:
        required: true
        type: string        # eg 52ec808
      local_image_name:
        required: false
        type: string        # the tag `make image` produces locally, before it is
        default: ""         # retagged to image_name (defaults to cyberdojo/<kosli_reference_name>)
      platforms:
        required: false
        type: string        # eg linux/amd64
        default: linux/amd64,linux/arm64

      # inputs for Kosli CLI commands
      kosli_flow:
        required: true
        type: string
      kosli_trail:          # eg ${{ vars.KOSLI_FLOW }}
        required: true
        type: string        # eg ${{ inputs.KOSLI_TRAIL }}
      kosli_reference_name:
        required: true
        type: string        # eg custom-start-points

      attest_to_kosli:
        required: false
        type: boolean       # eg ${{ github.ref == 'refs/heads/main' }}
        default: true
      kosli_cli_version:
        required: false
        type: string
        default: ${{ vars.KOSLI_CLI_VERSION }}
      kosli_debug:
        required: false
        type: string
        default: ${{ vars.KOSLI_DEBUG }}
      kosli_dry_run:
        required: false
        type: string
        default: ${{ vars.KOSLI_DRY_RUN }}
      kosli_host:
        required: false
        type: string
        default: ${{ vars.KOSLI_HOST }}
      kosli_org:
        required: false
        type: string
        default: ${{ vars.KOSLI_ORG }}

    secrets:
      kosli_api_token:
        required: true
      # The index is also tagged on Docker Hub as
      # cyberdojo/<last part of image_name>:<image_tag>, with the same digest.
      docker_user:
        required: true
      docker_pass:
        required: true


env:
  KOSLI_API_TOKEN: ${{ secrets.kosli_api_token }}
  KOSLI_DEBUG:     ${{ inputs.kosli_debug }}          # true/false
  KOSLI_DRY_RUN:   ${{ inputs.kosli_dry_run }}        # true/false
  KOSLI_HOST:      ${{ inputs.kosli_host }}           # https://app.kosli.com
  KOSLI_ORG:       ${{ inputs.kosli_org }}            # cyber-dojo
  KOSLI_FLOW:      ${{ inputs.kosli_flow }}           # custom-start-points-ci
  KOSLI_TRAIL:     ${{ inputs.kosli_trail }}

  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION:     ${{ vars.AWS_REGION }}

jobs:

  # Gate the build on this repo's own rego policy tests. Runs before the build
  # jobs (which need it), so a broken policy fails here before any image is built or
  # pushed. The tests need jq (preinstalled) and the kosli CLI; they call
  # `kosli evaluate input`, which makes no API calls, so no token is required.
  test-policies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout reusable-actions-workflows
        uses: actions/checkout@v6
        with:
          repository: cyber-dojo/reusable-actions-workflows
          ref: main

      - name: Setup Kosli CLI
        uses: kosli-dev/setup-cli-action@v5
        with:
          version: ${{ inputs.kosli_cli_version }}

      - name: Run rego policy tests
        shell: bash
        run: make test-provenance test-sbom

  # Each platform is built on a runner of that platform, so nothing is emulated:
  # `cyber-dojo start-point create` (through the caller's `make image`) runs a
  # plain docker build, which builds for the host. Each pushes its image to ECR
  # as :<tag>-<arch>, and create-index names both in one index under :<tag>.
  # `make image` runs the commander and versioner images, so on the arm64
  # runner both must publish linux/arm64. DOCKER_DEFAULT_PLATFORM names the
  # runner's own platform, so a caller script that defaults it to linux/amd64
  # (as languages-start-points does, for local Macs) builds and runs natively.
  # The two build jobs differ only in runs-on, the arch, and the if.
  build-amd64:
    needs: test-policies
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/gh_actions_services
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 2400
          role-session-name: ${{ github.event.repository.name }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: ${{ inputs.checkout_fetch_depth }}

      - name: Build the amd64 start-point image and push it to Amazon ECR
        id: docker_build
        env:
          ARCH: amd64
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          LOCAL_IMAGE: ${{ inputs.local_image_name || format('cyberdojo/{0}', inputs.kosli_reference_name) }}
        run: |
          git fetch origin main:main || true
          make image
          docker tag "${LOCAL_IMAGE}:${IMAGE_TAG}" "${IMAGE_NAME}:${IMAGE_TAG}-${ARCH}"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}-${ARCH}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}-${ARCH}" \
                      --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

  build-arm64:
    needs: test-policies
    if: ${{ contains(inputs.platforms, 'linux/arm64') }}
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.docker_build.outputs.digest }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/gh_actions_services
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 2400
          role-session-name: ${{ github.event.repository.name }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: ${{ inputs.checkout_fetch_depth }}

      - name: Build the arm64 start-point image and push it to Amazon ECR
        id: docker_build
        env:
          ARCH: arm64
          DOCKER_DEFAULT_PLATFORM: linux/arm64
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          LOCAL_IMAGE: ${{ inputs.local_image_name || format('cyberdojo/{0}', inputs.kosli_reference_name) }}
        run: |
          git fetch origin main:main || true
          make image
          docker tag "${LOCAL_IMAGE}:${IMAGE_TAG}" "${IMAGE_NAME}:${IMAGE_TAG}-${ARCH}"
          docker push "${IMAGE_NAME}:${IMAGE_TAG}-${ARCH}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}-${ARCH}" \
                      --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

  # Runs only if every platform asked for built and pushed, so a failure on any
  # one publishes no tag at all. The condition is spelled out because
  # build-arm64 is skipped when only linux/amd64 is asked for, and a skipped
  # dependency would otherwise skip this job too.
  create-index:
    needs: [build-amd64, build-arm64]
    if: >-
      always() &&
      needs.build-amd64.result == 'success' &&
      (!contains(inputs.platforms, 'linux/arm64') || needs.build-arm64.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.create-index.outputs.digest }}
      tagged_image_name: ${{ inputs.image_name }}:${{ inputs.image_tag }}
    permissions:
      id-token: write
      contents: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/gh_actions_services
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 2400
          role-session-name: ${{ github.event.repository.name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # kosli attest artifact reads the commit from the git repo in the working
      # directory. Before any file this job writes, as checkout cleans it.
      - uses: actions/checkout@v6
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
          fetch-depth: ${{ inputs.checkout_fetch_depth }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.docker_user }}
          password: ${{ secrets.docker_pass }}

      # One index, written under every tag, so ECR and Docker Hub hold the same
      # bytes and so the same digest. imagetools copies the blobs Docker Hub
      # lacks from ECR itself.
      - name: Create the multi-platform index
        id: create-index
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          TAGS=(--tag "${IMAGE_NAME}:${IMAGE_TAG}")
          TAGS+=(--tag "cyberdojo/${IMAGE_NAME##*/}:${IMAGE_TAG}")
          REFS=("${IMAGE_NAME}@${AMD64_DIGEST}")
          if [ -n "${ARM64_DIGEST}" ]; then
            REFS+=("${IMAGE_NAME}@${ARM64_DIGEST}")
          fi
          docker buildx imagetools create "${TAGS[@]}" "${REFS[@]}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}" \
                     --format '{{ json .Manifest }}' | jq -r .digest | sed 's/^sha256://')
          echo "DIGEST=${DIGEST}" >> "${GITHUB_ENV}"
          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Save Docker image ready to upload
        run: |
          docker pull ${{ inputs.image_name }}:${{ inputs.image_tag }}
          docker image save ${{ inputs.image_name }}:${{ inputs.image_tag }} --output ${{ runner.temp }}/${{ env.DIGEST }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DIGEST }}
          path: ${{ runner.temp }}/${{ env.DIGEST }}.tar

      # syft replaces buildkit's embedded scanner: it scans the finished image and
      # emits SPDX 2.3 JSON, identical in shape to `sbom: true`. syft does not care
      # that the image was not built from a Dockerfile.
      - name: Get SBOM file
        uses: anchore/sbom-action@v0
        with:
          image: ${{ inputs.image_name }}:${{ inputs.image_tag }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      # Attest the image and SBOM to GitHub and Kosli, distill provenance and
      # SBOM facts, evaluate them against SDLC-CTRL-0002 and SDLC-CTRL-0004, and
      # attest the two decisions. Shared with secure-docker-build.yml. Reads
      # sbom.spdx.json, ${{ env.DIGEST }} and the KOSLI_* env vars set above.
      - name: Attest and evaluate
        if: ${{ success() || failure() }}
        uses: cyber-dojo/reusable-actions-workflows/.github/actions/attest-and-evaluate@main
        with:
          image_name: ${{ inputs.image_name }}
          image_tag: ${{ inputs.image_tag }}
          kosli_reference_name: ${{ inputs.kosli_reference_name }}
          digest: ${{ env.DIGEST }}
          attest_to_kosli: ${{ inputs.attest_to_kosli }}
          kosli_cli_version: ${{ inputs.kosli_cli_version }}
