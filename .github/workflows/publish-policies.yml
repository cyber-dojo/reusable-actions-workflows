name: Publish rego policies

# attest-and-evaluate records its decisions with `kosli evaluate policy
# --identifier`, which evaluates the current published version, so a policy
# change reaches the decisions only once it is published from main.
on:
  push:
    branches: [main]
    paths:
      - SDLC-CTRL-0002/slsa-provenance.rego
      - SDLC-CTRL-0004/sbom.rego
      - SDLC-CTRL-0004/sbom.ergo.yaml
      - lib/ergo.rego
      - .github/workflows/publish-policies.yml
  # Publishing again is how a version Kosli could not validate is retried.
  workflow_dispatch:

permissions:
  contents: read

# An older merge publishing after a newer one would make its files the current
# version, so runs wait for each other.
concurrency:
  group: publish-policies-${{ github.ref }}
  cancel-in-progress: false

env:
  # Comma-separated, paired in order with the tokens in KOSLI_API_TOKEN.
  KOSLI_HOST: ${{ vars.KOSLI_HOST }}
  KOSLI_ORG: ${{ vars.KOSLI_ORG }}
  # Only an org admin can publish, so these are admin service-account keys that
  # only this repository can read.
  KOSLI_API_TOKEN: ${{ secrets.KOSLI_ADMIN_API_TOKEN }}

jobs:
  # A policy that fails its own tests is never published.
  test-policies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: kosli-dev/setup-cli-action@v5
        with:
          version: ${{ vars.KOSLI_CLI_VERSION }}

      # setup-opa takes a literal version, so read the pin out of test.env
      # rather than repeat it here and let the two drift apart.
      - name: Read the OPA pin from test.env
        id: pin
        run: |
          source test.env
          echo "opa-version=${OPA_VERSION}" >> "${GITHUB_OUTPUT}"

      - uses: open-policy-agent/setup-opa@v2.4.0
        with:
          version: ${{ steps.pin.outputs.opa-version }}

      - name: Run rego policy tests
        run: make test-provenance test-sbom

  # Both policies are published whichever one changed: Kosli stores no new
  # version for unchanged files.
  publish:
    name: Publish ${{ matrix.identifier }}
    needs: test-policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          # paths is space-separated, every file of the policy's bundle.
          - identifier: SDLC-CTRL-0002
            paths: SDLC-CTRL-0002/slsa-provenance.rego
            name: Binary Provenance (SLSA predicate)
            description: https://sdlc.kosli.com/controls/build/binary_provenance/
          - identifier: SDLC-CTRL-0004
            paths: SDLC-CTRL-0004/sbom.rego SDLC-CTRL-0004/sbom.ergo.yaml lib/ergo.rego
            name: Dependency Management (SBOM)
            description: https://sdlc.kosli.com/controls/build/dependency_management/
    steps:
      - uses: actions/checkout@v6

      - uses: kosli-dev/setup-cli-action@v5
        with:
          version: ${{ vars.KOSLI_CLI_VERSION }}

      - name: Publish ${{ matrix.identifier }}
        env:
          IDENTIFIER: ${{ matrix.identifier }}
          POLICY_PATHS: ${{ matrix.paths }}
          NAME: ${{ matrix.name }}
          DESCRIPTION: ${{ matrix.description }}
        run: |
          set -euo pipefail
          path_args=()
          for path in ${POLICY_PATHS}; do
            path_args+=(--path "${path}")
          done
          kosli publish rego-policy "${IDENTIFIER}" \
            "${path_args[@]}" \
            --input-schema trail \
            --name "${NAME}" \
            --description "${DESCRIPTION}" \
            --comment "$(git log -1 --format=%s), ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
